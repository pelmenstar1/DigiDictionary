[versions]
# Build tooling
agp = "9.4.0"
kotlin = "2.4.10"
ksp = "2.3.11"
jacoco = "0.8.15"

# SDK levels
compileSdk = "37"
targetSdk = "36"
minSdk = "26"

# Libraries
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
androidx-core = "1.19.0"
androidx-activity = "1.13.0"
androidx-appcompat = "1.8.0"
androidx-lifecycle = "2.11.0"
androidx-room = "2.8.5"
androidx-sqlite = "2.7.1"
androidx-nav = "2.10.1"
androidx-paging = "3.5.1"
androidx-fragment = "1.9.0"
androidx-browser = "1.10.0"
androidx-datastore = "1.2.1"
androidx-constraintlayout = "2.2.2"
androidx-viewpager = "1.1.0"
androidx-recyclerview = "1.4.0"
android-material = "1.14.0"
dagger-hilt = "2.60.1"
mpandroidchart = "v3.1.0"
sentry = "8.56.0"
sentry-gradlePlugin = "6.22.0"

# Test
junit = "4.13.2"
androidx-test-ext = "1.3.0"
androidx-test-espresso = "3.7.0"

[libraries]
# Kotlin related.
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Android related.
androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
# Pulled in transitively by fragment-ktx, but declared explicitly because MainActivity calls
# enableEdgeToEdge() directly.
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "androidx-activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
android-material = { module = "com.google.android.material:material", version.ref = "android-material" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-viewpager = { module = "androidx.viewpager2:viewpager2", version.ref = "androidx-viewpager" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidx-recyclerview" }

mpandroidchart = { module = "com.github.PhilJay:MPAndroidChart", version.ref = "mpandroidchart" }

androidx-lifecycle-viewModel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidx-room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "androidx-room" }
androidx-room-paging = { module = "androidx.room:room-paging", version.ref = "androidx-room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidx-room" }

androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidx-sqlite" }
androidx-sqlite-ktx = { module = "androidx.sqlite:sqlite-ktx", version.ref = "androidx-sqlite" }

androidx-nav-fragment = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "androidx-nav" }
androidx-nav-ui = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "androidx-nav" }

androidx-fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "androidx-fragment" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }

dagger-hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "dagger-hilt" }
dagger-hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "dagger-hilt" }

androidx-paging = { module = "androidx.paging:paging-runtime-ktx", version.ref = "androidx-paging" }

androidx-datastore-prefs = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }

# Only sentry-bom carries a version; the BOM pins every other io.sentry artifact at resolution time.
sentry-bom = { module = "io.sentry:sentry-bom", version.ref = "sentry" }
sentry-android = { module = "io.sentry:sentry-android" }
sentry-android-sqlite = { module = "io.sentry:sentry-android-sqlite" }
sentry-android-fragment = { module = "io.sentry:sentry-android-fragment" }
sentry-kotlin-extensions = { module = "io.sentry:sentry-kotlin-extensions" }

# Gradle plugins that must be put on the buildscript classpath. AGP 9 has built-in Kotlin support
# and ships with an older KGP, so these pin the versions actually used to compile the project.
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
kotlin-serialization-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }

# Test related.
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
androidx-test-ext = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
androidx-test-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "androidx-room" }
androidx-fragment-testing = { module = "androidx.fragment:fragment-testing", version.ref = "androidx-fragment" }
androidx-fragment-testing-manifest = { module = "androidx.fragment:fragment-testing-manifest", version.ref = "androidx-fragment" }

[bundles]
kotlinx-coroutines = ["kotlinx-coroutines-core", "kotlinx-coroutines-android"]
androidx-lifecycle = ["androidx-lifecycle-viewModel", "androidx-lifecycle-runtime"]
androidx-sqlite = ["androidx-sqlite", "androidx-sqlite-ktx"]
androidx-nav = ["androidx-nav-fragment", "androidx-nav-ui"]
kotlin-test = ["kotlin-test", "kotlin-test-junit"]
kotlin-test-junit = ["junit", "kotlin-test", "kotlin-test-junit"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
dagger-hilt = { id = "com.google.dagger.hilt.android", version.ref = "dagger-hilt" }
androidx-room = { id = "androidx.room", version.ref = "androidx-room" }
androidx-nav-safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "androidx-nav" }
sentry-android-gradle = { id = "io.sentry.android.gradle", version.ref = "sentry-gradlePlugin" }
